# Coolify production stack — one resource, three containers, one private network.
#
# The application has a single public origin. It serves the SPA and proxies `/api/*` to a backend
# that has no public route at all: the browser never makes a cross-origin request, so the session
# cookie is host-only to the origin it is already on and there is no CORS allowance to get wrong.
#
# The renderer is separate and public for the opposite reason. It serves *customer* content, and
# sharing an origin with the authenticated dashboard would put a published customer page and the
# admin session cookie on one host.
#
# ROUTING
#
# Coolify shows a domain field per service. Two of the three carry one:
#
#     frontend   https://websitebuilder.oneplataforma.com:8080
#     backend    (empty — private at backend:3000)
#     renderer   https://origin.websitebuilder.oneplataforma.com:3001
#
# The `:8080` and `:3001` name the container port behind each hostname; neither appears in a public
# URL. Coolify generates the Traefik router for each field.
#
# What a domain field cannot express is a set of hostnames that does not exist yet: every project
# gets a subdomain, and every customer may bring their own. Those route to the renderer through the
# label below — not through additional Coolify applications, and never through the frontend
# container, which knows nothing about published sites.
#
# Required variables have no default on purpose: `${VAR:?message}` stops the deployment rather than
# starting a service configured with an empty string.

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    # No routing labels and no SERVICE_FQDN: the application's domain is the one field configured by
    # hand in Coolify, and Coolify generates its router. Declaring it twice would produce two routers
    # for one hostname and leave which one wins to rule-length arithmetic.
    #
    # Health-gated so the gateway is not published while its upstream is still starting. The
    # gateway's own health does not depend on the API, so a later backend restart does not take the
    # frontend down with it.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 64M }

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    restart: unless-stopped
    # Deliberately no SERVICE_FQDN and no `ports`: this service must not be publicly routable. It is
    # reached only as `backend:3000` on the private network below, which is what makes the
    # single-origin design true rather than merely intended.
    expose: ["3000"]
    environment:
      NODE_ENV: production
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGODB_URI: ${MONGODB_URI:?set the MongoDB connection string}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:?set the MongoDB database name}
      # At least 32 bytes. Sessions signed with a weak secret are forgeable.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set a session signing secret of at least 32 characters}
      # The application origin: the API answers under it at /api/auth, so the cookie is issued for
      # the host the browser is already on.
      BETTER_AUTH_URL: ${PLATFORM_PUBLIC_ORIGIN:?set the public application origin}
      BETTER_AUTH_BASE_PATH: /api/auth
      FRONTEND_ORIGIN: ${PLATFORM_PUBLIC_ORIGIN}
      PLATFORM_ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN:?set the platform root domain}
      PLATFORM_PUBLIC_ORIGIN: ${PLATFORM_PUBLIC_ORIGIN}
      PLATFORM_RESERVED_SUBDOMAINS: ${PLATFORM_RESERVED_SUBDOMAINS:-www,app,api,admin,origin,customers,coolify,status,mail,cdn,assets,static,docs,support}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-8mb}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-30000}
      PUBLISHED_VERSION_RETENTION_COUNT: ${PUBLISHED_VERSION_RETENTION_COUNT:-20}
      PUBLISH_MAX_DOCUMENT_BYTES: ${PUBLISH_MAX_DOCUMENT_BYTES:-4000000}
      # Optional. Absent, the platform runs and only connecting a customer's own domain is refused.
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_SAAS_CNAME_TARGET: ${CLOUDFLARE_SAAS_CNAME_TARGET:-}
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { memory: 1G }
        reservations: { memory: 256M }

  renderer:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: renderer
    restart: unless-stopped
    # The renderer's own hostname comes from its Coolify domain field. This label adds the one thing
    # that field cannot express: the open-ended set of project subdomains. Its priority is explicit
    # and deliberately low — Traefik defaults to rule length, under which a long regexp outranks a
    # short exact host, and both this platform's domains would lose to the project wildcard.
    #
    # Verify the generated routers after the first deploy rather than trusting this comment:
    #   docker inspect <renderer container> --format '{{json .Config.Labels}}' | jq
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COOLIFY_PROXY_NETWORK:-coolify}
      - traefik.http.services.wb-renderer.loadbalancer.server.port=3001

      # No router for the technical origin: that hostname is the renderer's Coolify domain field,
      # and Coolify generates its router. Declaring it here as well would produce two routers for
      # one hostname and leave which one wins to rule-length arithmetic.

      # Project subdomains. The pattern requires a label before the root domain, so the application's
      # own apex does not match it — that hostname belongs to the frontend and must never reach here.
      - traefik.http.routers.wb-renderer-projects.rule=HostRegexp(`^[a-z0-9][a-z0-9-]*\.${PLATFORM_ROOT_DOMAIN_REGEX:?set the root domain with dots escaped, e.g. websitebuilder\.oneplataforma\.com}$$`)
      - traefik.http.routers.wb-renderer-projects.entrypoints=https
      - traefik.http.routers.wb-renderer-projects.tls=true
      # A certificate for every project subdomain, which means one wildcard certificate.
      #
      # This is the part that cannot be solved with an HTTP challenge: Let's Encrypt issues
      # `*.example.com` only through DNS-01, so the resolver named here must be configured on the
      # proxy with a `dnsChallenge` and a DNS provider token. Point `WILDCARD_CERT_RESOLVER` at that
      # resolver. Left at the default, Traefik will try the HTTP challenge for every new subdomain
      # separately, fail to obtain one, and serve its own self-signed certificate — which is a
      # browser warning that says the site is impersonating itself.
      - traefik.http.routers.wb-renderer-projects.tls.certresolver=${WILDCARD_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.wb-renderer-projects.tls.domains[0].main=${PLATFORM_ROOT_DOMAIN}
      - traefik.http.routers.wb-renderer-projects.tls.domains[0].sans=*.${PLATFORM_ROOT_DOMAIN}
      - traefik.http.routers.wb-renderer-projects.service=wb-renderer
      # Below any exact-host router: this platform's own two domain fields, and every other
      # application on this VPS.
      - traefik.http.routers.wb-renderer-projects.priority=10

      # The same set of hostnames on the plain HTTP entrypoint, redirected. Without it a visitor who
      # types the address without a scheme reaches an entrypoint where no router matches and gets
      # Traefik's own 404 — a page that looks like the site does not exist, when it does.
      # Coolify's generated routers get this redirect for their own hostnames; a label-defined
      # router has to carry its own.
      - traefik.http.middlewares.wb-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.wb-https-redirect.redirectscheme.permanent=true
      - traefik.http.routers.wb-renderer-projects-http.rule=HostRegexp(`^[a-z0-9][a-z0-9-]*\.${PLATFORM_ROOT_DOMAIN_REGEX}$$`)
      - traefik.http.routers.wb-renderer-projects-http.entrypoints=http
      - traefik.http.routers.wb-renderer-projects-http.middlewares=wb-https-redirect
      - traefik.http.routers.wb-renderer-projects-http.service=wb-renderer
      - traefik.http.routers.wb-renderer-projects-http.priority=10
    environment:
      NODE_ENV: production
      PUBLIC_RENDERER_PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME}
      PLATFORM_ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN}
      # Its own hostname, used as the Cloudflare fallback origin and the CNAME target customers are
      # told to point at. A hostname, not an origin: neither use accepts a scheme.
      PUBLIC_RENDERER_HOST: ${PUBLIC_RENDERER_HOST:?set the technical renderer hostname, without a scheme}
      # Published pages reference media at this origin, which is where the API answers.
      PLATFORM_PUBLIC_ORIGIN: ${PLATFORM_PUBLIC_ORIGIN}
      PUBLIC_SITE_CACHE_TTL_SECONDS: ${PUBLIC_SITE_CACHE_TTL_SECONDS:-60}
      # Analytics ingestion. Off unless an operator turns it on, so a deployment never starts with an
      # open write endpoint by accident — and each site has its own switch besides this one.
      ANALYTICS_INGESTION_ENABLED: ${ANALYTICS_INGESTION_ENABLED:-false}
      # Batches per minute. The address bucket needs TRUSTED_PROXY_CIDRS below to be meaningful:
      # without it every visitor presents the gateway's address and would share one allowance.
      ANALYTICS_RATE_LIMIT_PER_ADDRESS: ${ANALYTICS_RATE_LIMIT_PER_ADDRESS:-60}
      ANALYTICS_RATE_LIMIT_PER_PROJECT: ${ANALYTICS_RATE_LIMIT_PER_PROJECT:-600}
      # Must match the real Coolify/Traefik proxy range before any forwarded header is trusted.
      # Empty trusts nothing, which is the safe default on a host-routed multi-tenant renderer.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    # No BETTER_AUTH_SECRET: the renderer has no sessions, and a signing secret handed to a process
    # that cannot use it only widens what a compromise reaches.
    #
    # On both networks: `internal` for nothing in particular today, and the proxy network because
    # Traefik routes to it by label and cannot reach a container it does not share a network with.
    networks: [internal, proxy]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 128M }

networks:
  internal:
    driver: bridge
  # Coolify's own proxy network, created outside this file. Declared external so Compose attaches to
  # it rather than creating a second one that Traefik is not on.
  proxy:
    external: true
    name: ${COOLIFY_PROXY_NETWORK:-coolify}
