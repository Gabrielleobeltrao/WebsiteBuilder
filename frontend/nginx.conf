server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Coolify's proxy terminates TLS and forwards the real client address. Only the private ranges
  # Docker allocates from are trusted: `0.0.0.0/0` would let any caller set X-Forwarded-For and have
  # it believed, which is how an audit trail ends up recording whatever an attacker typed.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Matches the backend's JSON_BODY_LIMIT. Smaller here and a legitimate save is refused by the
  # proxy with an HTML error the client cannot parse; larger and the backend rejects it only after
  # the whole body has crossed the network.
  client_max_body_size 16m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The API, matched before any SPA rule can see it. This ordering is the entire point: if
  # index.html were ever served for /api/*, a backend outage would return 200 with HTML and every
  # client would parse a login page as JSON — a failure that presents as a rejected login.
  #
  # `backend` resolves on the Compose network. proxy_pass without a URI part passes the request path
  # through unchanged, so /api/v1/health arrives as /api/v1/health.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Correlates one request across the gateway and the API when reading logs after an incident.
    proxy_set_header X-Request-Id $request_id;

    # Session cookies must survive the hop; Better Auth sets them on this same origin.
    proxy_pass_request_headers on;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Backend failures stay backend failures. No fallback, no interception, no HTML.
    proxy_intercept_errors off;

    # An API response is never a cache hit from this layer.
    add_header Cache-Control "no-store" always;
  }

  # Hashed build assets never change under the same name, so they can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html itself must not be cached, or a deploy leaves browsers loading stale asset names.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri $uri/ /index.html;
  }

  # Health endpoint for the platform. Serves no application data and does not reach the API, so the
  # gateway reports itself healthy while the backend is restarting rather than failing with it.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
