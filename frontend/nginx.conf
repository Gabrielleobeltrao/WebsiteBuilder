server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Coolify's proxy terminates TLS and forwards the real client address.
  real_ip_header X-Forwarded-For;
  set_real_ip_from 0.0.0.0/0;

  client_max_body_size 16m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # No /api proxy: the API is its own host and the browser calls it directly. A proxy block here
  # would be worse than unused — nginx resolves an upstream hostname at start-up and refuses to
  # boot when it cannot, so dead configuration would take the whole gateway down with it.
  #
  # If this ever serves an origin that also hosts the API, the block must be added *above* the SPA
  # fallback below. That ordering is the point: index.html served for /api/* turns a backend outage
  # into a 200 with HTML, and every client parses a login page as JSON.

  # Hashed build assets never change under the same name, so they can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html itself must not be cached, or a deploy leaves browsers loading stale asset names.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }

  # Health endpoint for the platform. Serves no application data.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
