server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Coolify's proxy terminates TLS and forwards the real client address.
  real_ip_header X-Forwarded-For;
  set_real_ip_from 0.0.0.0/0;

  client_max_body_size 16m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The API is proxied before any SPA rule can see it. This ordering is the whole point: if
  # index.html were ever served for /api/*, a backend outage would return 200 with HTML and every
  # client would parse a login page as JSON.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Session cookies must survive the hop, and Better Auth sets them on this same origin.
    proxy_pass_request_headers on;
    proxy_read_timeout 60s;

    # Backend failures stay backend failures. No fallback, no interception.
    proxy_intercept_errors off;
  }

  # Hashed build assets never change under the same name, so they can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html itself must not be cached, or a deploy leaves browsers loading stale asset names.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }

  # Health endpoint for the platform. Serves no application data.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
